name: CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

jobs:
  pytest:
    if: ${{ github.repository == 'BrkRaw/brkraw-viewer' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        pytest-version: ["7.4.*", "8.*"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest==${{ matrix.pytest-version }}
      - name: Run tests
        run: |
          pytest -q

  ecosystem-contract:
    if: ${{ github.repository == 'BrkRaw/brkraw-viewer' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: viewer
      - uses: actions/checkout@v4
        with:
          repository: BrkRaw/brkraw
          path: core
      - uses: actions/checkout@v4
        with:
          repository: BrkRaw/brkraw-hook
          path: hook
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            viewer/pyproject.toml
            hook/pyproject.toml
      - name: Install current packages
        run: python -m pip install ./core ./hook ./viewer pytest
      - name: Check installed ecosystem contracts
        env:
          BRKRAW_ECOSYSTEM_CONTRACT: '1'
        run: python -m pytest -q viewer/tests/test_ecosystem_installed.py
