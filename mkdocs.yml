site_name: BrkRaw Viewer
site_url: https://brkraw.github.io/brkraw-viewer
repo_url: https://github.com/brkraw/brkraw-viewer
repo_name: brkraw/brkraw-viewer
theme:
  name: material
  logo: assets/brkraw-viewer-logo-dark.svg
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - toc:
      permalink: true
extra_css:
  - stylesheets/logo.css
nav:
  - Home: index.md
  - User Guide:
      - Viewer: user/viewer.md
      - Addon & Params: user/addon-params.md
      - Convert: user/convert.md
      - Config: user/config.md
      - Try New Features: user/try-new-features.md
  - Extensions:
      - Overview: extensions/index.md
  - Developer Guide:
      - Viewer Hooks: dev/hooks.md
      - GUI Best Practices: dev/gui.md
      - Release Flow: dev/release.md
      - Contributors: dev/contributors.md
      - How-to: dev/howto.md
      - Design Stage 3: dev/design-stage3.md
      - Design Stage 4 Handle: dev/design-stage4-handle.md
      - Style Notes: STYLE.md
  - References:
      - Public Bruker 4D Datasets: references/public-bruker-4d-datasets.md
